[package]
name = "chess-app"
version = "0.0.1"
description = "Desktop chess with a Rust engine and a JavaScript engine."
authors = ["Rumen Damyanov <contact@rumenx.com>"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "chess_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Linux builds pull gtk 0.18, which requires glib ^0.18. RUSTSEC-2024-0429
# is fixed in glib 0.20, and gtk 0.18 cannot take that release. Tauri 2.12
# still depends on gtk 0.18. See SECURITY.md.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumenx-chess = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
