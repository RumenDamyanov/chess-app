[package]
name = "chess-app"
version = "0.0.1"
description = "A desktop window for the chess engines already built."
authors = ["Rumen Damyanov <contact@rumenx.com>"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "chess_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumenx-chess = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
